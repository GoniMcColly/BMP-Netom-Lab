# Netom 0.6.0 — downstream consumer of the main netom's BMP restream.
#
#   routers --BMP--> netom (.101) [bmp-in -> rib -> bmp-out :11020] --BMP--> netom-consumer (.102)
#
# This instance talks to no router. It dials the main netom's bmp-tcp-out port
# and receives Initiation, synthetic Peer Ups, the full RIB dump and End-of-RIB,
# then live updates. Restart it and it has the complete table again within
# seconds, without any router sending a single extra BMP message.

log_level = "info"
log_target = "stderr"
http_listen = ["0.0.0.0:8080"]

[units.upstream]
type = "bmp-tcp-in"
# Active mode: we open the TCP session to the upstream netom.
connect = "172.20.20.101:11020"
# No bmp-tcp-out here, so the verbatim copies for the fastpath are not needed.
forward_raw_updates = false

[units.rib]
type = "rib"
sources = ["upstream"]

[targets.null]
type = "null-out"
sources = ["rib"]
