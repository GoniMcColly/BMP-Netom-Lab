# Netom 0.6.0 — BMP demo lab configuration
#
# Pipeline:
#   FRR routers --BMP--> [bmp-in] --> [rib] --> [bmp-out] :11020 --BMP--> netom-consumer(s)
#                            |           |
#                            |           +--> [null] (RIB needs a downstream consumer)
#                            +-- Roto bmp_in        +-- Roto rib_in_pre --> [roto-log] file
#
# Global settings MUST stay above the first [units.*] table (TOML scoping).

log_level = "info"
log_target = "stderr"

# Bound to all interfaces so Prometheus/Grafana containers can reach it.
# The API is unauthenticated and unencrypted: fine for a lab, never in prod.
http_listen = ["0.0.0.0:8080"]

# Filters are bound by fixed function name (bmp_in, rib_in_pre, ...),
# no per-unit filter_name is required.
roto_script = "/etc/netom/filters.roto"

[units.bmp-in]
type = "bmp-tcp-in"
listen = "0.0.0.0:11019"
# Default true: emit a verbatim copy of each Route Monitoring message ahead of
# the parsed routes, consumed by the bmp-out fastpath. Keep it on for the
# restream demo.
forward_raw_updates = true
# Default false. Leave post-policy routes in: they are the point of the demo.
ignore_post_policy_routes = false

[units.rib]
type = "rib"
sources = ["bmp-in"]

[units.bmp-out]
type = "bmp-tcp-out"
listen = "0.0.0.0:11020"
sources = ["rib"]
rib_unit = "rib"
sys_name = "netom-lab"
sys_descr = "Netom BMP restreamer (lab)"
acl = ["172.20.20.0/24"]
# Default true: live Route Monitoring is forwarded byte-for-byte; only the BMP
# common + per-peer headers are rebuilt. The initial table dump is always
# rebuilt from the RIB.
fastpath = true
# Default true: Peer Up carries an RFC 9736 Admin Label TLV with the upstream
# router's sysName/sysDescr as JSON.
forward_router_info = true
# Per-consumer queue for live updates (messages). When it fills, netom drops
# that consumer instead of slowing down ingest; the consumer reconnects and
# gets a fresh dump. Default 1024 is too small for act 3 (11+ routers dumping
# at once). 65536 x ~150 B = ~10 MB per consumer.
live_queue_depth = 65536

[targets.null]
type = "null-out"
sources = ["rib"]

# netom only starts units whose output something consumes; anything else is
# logged as "Unit '...' is unused and will not be started." Without this
# target, bmp-out never binds :11020 and consumers get "connection refused".
[targets.bmp-out-anchor]
type = "null-out"
sources = ["bmp-out"]

# Receives the Roto `output.*` log entries produced by rib_in_pre.
# file-out takes a single source (string, not a list).
[targets.roto-log]
type = "file-out"
sources = "rib"
format = "json"
filename = "/tmp/roto-events.json"
