frr defaults traditional
hostname r5-agg
log stdout informational
!
interface lo
 ip address 5.5.5.5/32
exit
!
router bgp 65000
 bgp router-id 5.5.5.5
 no bgp ebgp-requires-policy
 neighbor 10.0.35.1 remote-as 65000
 neighbor 10.0.35.1 description r3-edge
 neighbor 10.0.56.2 remote-as 65100
 neighbor 10.0.56.2 description r6-cust
 !
 address-family ipv4 unicast
  network 5.5.5.5/32
  neighbor 10.0.35.1 next-hop-self
 exit-address-family
 !
 bmp targets netom-collector
  bmp stats interval 15000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp connect 172.20.20.101 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
