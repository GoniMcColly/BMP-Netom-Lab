frr defaults traditional
hostname r3-edge
log stdout informational
!
interface lo
 ip address 3.3.3.3/32
exit
!
! Demo policy: drop 10.99.99.0/24 from ISP1, prefer everything else from ISP1.
! The prefix-list selects what the route-map entry acts on: "permit" here
! means "matches", and route-map entry 10 then DENIES the match.
ip prefix-list BOGON_DROP seq 5 permit 10.99.99.0/24
!
route-map FROM_ISP1 deny 10
 match ip address prefix-list BOGON_DROP
exit
!
route-map FROM_ISP1 permit 20
 set local-preference 200
exit
!
router bgp 65000
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.13.1 description r1-isp1
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.23.1 description r2-isp2
 neighbor 10.0.34.2 remote-as 65535
 neighbor 10.0.34.2 description r4-ixp
 neighbor 10.0.35.2 remote-as 65000
 neighbor 10.0.35.2 description r5-agg
 !
 address-family ipv4 unicast
  network 3.3.3.3/32
  ! keeps an unfiltered copy of what r1 sent (= Adj-RIB-In pre-policy)
  neighbor 10.0.13.1 soft-reconfiguration inbound
  neighbor 10.0.13.1 route-map FROM_ISP1 in
  neighbor 10.0.35.2 next-hop-self
 exit-address-family
 !
 bmp targets netom-collector
  bmp stats interval 15000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp connect 172.20.20.101 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
