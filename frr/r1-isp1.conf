frr defaults traditional
hostname r1-isp1
log stdout informational
!
interface lo
 ip address 1.1.1.1/32
 ip address 10.99.99.1/24
exit
!
bgp as-path access-list NOT_VIA_65000 seq 5 deny _65000_
bgp as-path access-list NOT_VIA_65000 seq 10 permit .*
!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.13.2 remote-as 65000
 ! Don't echo r3's own routes back to it (they would show up as 8 extra
 ! "pre-policy only" prefixes on netom's diff page and hide the real filter).
 ! (sender-as-path-loop-detection had no effect in FRR 10.0.1)
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
  network 10.99.99.0/24
  neighbor 10.0.13.2 filter-list NOT_VIA_65000 out
 exit-address-family
 !
 bmp targets netom-collector
  bmp stats interval 15000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp connect 172.20.20.101 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
